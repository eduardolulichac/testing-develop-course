# Compose de tu reto. Ya incluye la Arena (db + api + web); falta TU servicio `tests`.
# Objetivo: que este único comando levante la Arena, ejecute la suite y devuelva su código de salida:
#   docker compose up --build --abort-on-container-exit --exit-code-from tests
# Reglas: un `include` local está permitido; no uses `privileged`, `network_mode: host`, `pid: host`
# ni montes el socket de Docker ni rutas fuera de este repositorio.
name: reto-docker

include:
  - arena/compose.yml

