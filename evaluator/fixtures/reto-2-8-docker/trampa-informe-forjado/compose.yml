name: reto-docker

include:
  - arena/compose.yml

services:
  tests:
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      ARENA_URL: http://web
      USUARIO_EMAIL:
      USUARIO_CLAVE:
      CI: "1"
    ipc: host
    init: true
    command: ["sh", "-c", "mkdir -p resultados && cp falso.json resultados/informe.json"]
    volumes:
      - ./resultados:/app/resultados
