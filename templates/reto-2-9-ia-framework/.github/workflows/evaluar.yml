name: Evaluar reto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluar:
    # Reemplazado por el SHA de 40 caracteres y la etiqueta al publicar (scripts/publish.ts).
    uses: eduardolulichac/qa-course-evaluator/.github/workflows/evaluate.yml@__EVALUATOR_SHA__ # __EVALUATOR_VERSION__
    with:
      exercise: reto-2-9-ia-framework
      key_id: ${{ vars.COURSE_KEY_ID }}
    secrets:
      COURSE_CHALLENGE_KEY: ${{ secrets.COURSE_CHALLENGE_KEY }}
