# QA Arena: front + API + Postgres propio. Un comando: `docker compose up --build`
# Puertos por defecto: web 18080, api 18081 (la base no se publica). Cambiables con WEB_PORT / API_PORT.
# Los valores de POSTGRES_* y ARENA_APP_PASSWORD son solo de desarrollo local; en un host real se definen fuera del repo.
# La API se conecta como `arena_app` (sin superusuario, ver db/init). El rol se crea solo en volúmenes nuevos:
# tras cambiarlo, `docker compose down -v`.
# El rol `arena_qa` (db/init/02-qa-reader.sh) es de solo lectura sobre vistas `tienda.*`; su contraseña de práctica
# (ARENA_QA_PASSWORD) es pública, no un secreto: la Arena está aislada.
name: qa-arena

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-arena}
      ARENA_APP_PASSWORD: ${ARENA_APP_PASSWORD:-arena_app_local_only}
      ARENA_QA_PASSWORD: ${ARENA_QA_PASSWORD:-arena_qa_local_only}
    # Solo localhost; el rol arena_qa es de solo lectura.
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - arena-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ../..
      dockerfile: apps/qa-arena/api/Dockerfile
    environment:
      DATABASE_URL: postgres://arena_app:${ARENA_APP_PASSWORD:-arena_app_local_only}@db:5432/${POSTGRES_DB:-arena}
      API_PORT: "3000"
      ARENA_SESSION_MODE: ${ARENA_SESSION_MODE:-shared}
      ARENA_DEPLOYMENT: ${ARENA_DEPLOYMENT:-local}
      ARENA_COOKIE_SECRET: ${ARENA_COOKIE_SECRET:-}
      ARENA_MAX_SESSIONS_PER_IP: ${ARENA_MAX_SESSIONS_PER_IP:-3}
      ARENA_RATE_LIMIT_PER_MIN: ${ARENA_RATE_LIMIT_PER_MIN:-120}
      ARENA_DEFAULT_SCENARIO: ${ARENA_DEFAULT_SCENARIO:-}
      ARENA_TRUST_PROXY: ${ARENA_TRUST_PROXY:-0}
      ARENA_SESSION_TTL_MINUTES: ${ARENA_SESSION_TTL_MINUTES:-240}
      ARENA_MAX_SESSIONS: ${ARENA_MAX_SESSIONS:-500}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-18081}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: apps/qa-arena/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-18080}:80"

volumes:
  arena-db:
